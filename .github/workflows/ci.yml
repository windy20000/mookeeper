# MooKeeper CI —— 无头冒烟 + 密钥扫描。
# 刻意**不**在 CI 跑 GUI 诊断口（--errtest / --menu-keytest 的弹菜单跟踪、离屏出图依赖真实登录
# Aqua 会话，macOS runner 上时灵时不灵——假绿比无绿更糟）。维护者在有登录会话的机器上跑
# `./scripts/test.sh --gui` 补全这一段，PR 里注明即可。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-smoke:
    name: Build + headless smoke
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 要扫全历史

      - name: Toolchain
        run: xcode-select -p && swiftc -version

      - name: Build + smoke (headless subset)
        run: ./scripts/test.sh

      - name: Secret scan (gitleaks)
        # ⚠ gitleaks 8.30 重构了 CLI（--red → --redact 等），brew 跟最新必然漂——命令只用最稳的
        # `detect --source .`（有泄漏 exit≠0，本机 8.30.1 实测 no leaks 绿）。
        run: |
          brew install gitleaks
          gitleaks detect --source .
